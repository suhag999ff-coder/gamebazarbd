<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#006a4e">
<title>GAME BAZAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="css/user.css">
</head>
<body class="select-none">

<!-- AUTH -->
<section id="auth-sec" class="z-50">
  <div class="auth-scene">
    <div class="bd-flag-showcase" aria-hidden="true">
      <div class="pole"></div><div class="cloth"></div>
    </div>
    <div class="auth-card">
      <h1 id="auth-site-name" class="auth-brand">GAME <span>BAZAR</span></h1>
      <p class="auth-tagline">Premium Top-Up Service</p>
      <div class="auth-tabs">
        <button type="button" onclick="toggleAuth('login')" id="btn-login-view" class="auth-tab on"><i class="fas fa-sign-in-alt"></i> Login</button>
        <button type="button" onclick="toggleAuth('register')" id="btn-reg-view" class="auth-tab"><i class="fas fa-user-plus"></i> Register</button>
      </div>
      <div id="login-form">
        <div class="auth-field"><input type="email" id="login-email" placeholder="Email Address" class="auth-input" autocomplete="email"><i class="fas fa-envelope auth-icon"></i></div>
        <div class="auth-field"><input type="password" id="login-pass" placeholder="Password" class="auth-input" autocomplete="current-password"><i class="fas fa-lock auth-icon"></i><button type="button" onclick="togglePass('login-pass',this)" class="auth-eye-btn"><i class="fas fa-eye"></i></button></div>
        <button type="button" onclick="handleLogin()" class="auth-btn"><i class="fas fa-sign-in-alt"></i> LOG IN</button>
      </div>
      <div id="register-form" class="hidden">
        <div class="auth-field"><input type="text" id="reg-name" placeholder="Full Name" class="auth-input"><i class="fas fa-user auth-icon"></i></div>
        <div class="auth-field"><input type="email" id="reg-email" placeholder="Email Address" class="auth-input"><i class="fas fa-envelope auth-icon"></i></div>
        <div class="auth-field"><input type="number" id="reg-phone" placeholder="Phone Number" class="auth-input"><i class="fas fa-phone auth-icon"></i></div>
        <div class="auth-field"><input type="password" id="reg-pass" placeholder="Password (6+ chars)" class="auth-input"><i class="fas fa-key auth-icon"></i><button type="button" onclick="togglePass('reg-pass',this)" class="auth-eye-btn"><i class="fas fa-eye"></i></button></div>
        <button type="button" onclick="handleRegister()" class="auth-btn"><i class="fas fa-user-plus"></i> CREATE ACCOUNT</button>
      </div>
    </div>
  </div>
</section>

<!-- APP -->
<div id="app-content" class="app-shell hidden">
  <header class="bg-white sticky top-0 z-40 shadow-sm border-b border-gray-100">
    <div class="px-4 py-2.5 flex justify-between items-center gap-3">
      <img id="header-logo-img" src="https://placehold.co/150x50/006a4e/fff?text=GAME+BAZAR" class="h-9 object-contain">
      <div class="flex items-center gap-2">
        <button type="button" onclick="showSec('addmoney')" class="flex items-center gap-1.5 bg-gradient-to-r from-[#006a4e] to-[#00875f] text-white px-3 py-2 rounded-full shadow-md active:scale-95">
          <i class="fas fa-wallet text-xs"></i><span class="text-[13px] font-bold">৳<span id="header-balance">0</span></span>
        </button>
        <button type="button" onclick="showSec('account')" class="w-10 h-10 rounded-full bg-gradient-to-br from-[#006a4e] to-[#00875f] flex items-center justify-center text-white font-black shadow-md border-2 border-white text-sm active:scale-95"><span id="header-avatar">U</span></button>
      </div>
    </div>
    <div id="notice-bar" class="px-3 pb-3">
      <div class="bg-gradient-to-r from-[#003d2d] to-[#006a4e] rounded-2xl py-2.5 pl-3 pr-2 flex items-center gap-3 shadow-md" style="min-height:42px">
        <div class="flex items-center gap-2 flex-shrink-0">
          <div class="w-6 h-6 rounded-full bg-white/20 border border-white/30 flex items-center justify-center"><span class="w-2 h-2 bg-white rounded-full live-dot"></span></div>
          <span class="text-[10px] font-extrabold text-white uppercase tracking-widest whitespace-nowrap">Notice</span>
        </div>
        <div class="notice-scroll-wrapper"><div id="notice-text" class="notice-scroll-text">Welcome</div></div>
        <button type="button" onclick="hideNotice()" class="w-7 h-7 rounded-full bg-white/15 border border-white/20 flex items-center justify-center text-white flex-shrink-0"><i class="fas fa-times text-[10px]"></i></button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <!-- PASTE ALL YOUR EXISTING SECTIONS HERE (home, orders, addmoney, codes, account, topup, payment, am-payment) - unchanged from your original, only GAME BAZAR brand text -->
    <!-- Just copy the <section> blocks from your original index.html -->
  </main>

  <!-- SUPPORT FAB -->
  <div class="fixed bottom-24 right-4 z-40 flex flex-col items-end gap-2.5" style="max-width:480px">
    <div id="support-bubbles" class="flex flex-col items-end gap-2.5"></div>
    <button type="button" onclick="toggleSupport()" id="support-btn" class="w-14 h-14 rounded-full bg-gradient-to-br from-[#003d2d] to-[#006a4e] flex items-center justify-center text-white shadow-2xl support-ring"><i class="fas fa-headset text-xl" id="support-icon"></i></button>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white border-t border-gray-100 shadow-[0_-6px_24px_rgba(0,106,78,0.08)] z-40">
    <div class="flex items-center justify-between px-3 pt-1.5 pb-2">
      <button type="button" onclick="showSec('home')" class="nvi on" id="nav-home"><i class="fas fa-home ni"></i><span>Home</span></button>
      <button type="button" onclick="showSec('orders')" class="nvi" id="nav-orders"><i class="fas fa-shopping-bag ni"></i><span>Orders</span></button>
      <button type="button" onclick="showSec('addmoney')" class="relative -mt-7 active:scale-90">
        <div class="rounded-full bg-gradient-to-br from-[#003d2d] to-[#006a4e] flex items-center justify-center text-white shadow-xl border-4 border-white" style="width:60px;height:60px"><i class="fas fa-plus text-2xl"></i></div>
      </button>
      <button type="button" onclick="showSec('codes')" class="nvi" id="nav-codes"><i class="fas fa-ticket-alt ni"></i><span>Codes</span></button>
      <button type="button" onclick="showSec('account')" class="nvi" id="nav-account"><i class="fas fa-user ni"></i><span>Account</span></button>
    </div>
  </nav>
</div>

<script type="module">
  import { db, auth } from './js/firebase-config.js';
  import { notify } from './js/telegram.js';
  window.__db = db; window.__auth = auth; window.__notify = notify;
</script>
<script src="js/user.js"></script>
</body>
</html>
