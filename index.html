<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GAME BAZAR</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<!-- CSS লিংক -->
<link rel="stylesheet" href="css/user.css">
</head>
<body class="select-none">

<!-- LOGIN SECTION -->
<section id="auth-sec" class="z-50">
  <div class="auth-card">
    <h1 class="auth-brand">GAME <span>BAZAR</span></h1>
    <p class="auth-tagline">Premium Top-Up Service</p>
    
    <div class="auth-tabs">
      <button type="button" onclick="toggleAuth('login')" id="btn-login-view" class="auth-tab on"><i class="fas fa-sign-in-alt"></i> Login</button>
      <button type="button" onclick="toggleAuth('register')" id="btn-reg-view" class="auth-tab"><i class="fas fa-user-plus"></i> Register</button>
    </div>
    
    <div id="login-form">
      <div class="auth-field"><input type="email" id="login-email" placeholder="Email Address" class="auth-input"><i class="fas fa-envelope auth-icon"></i></div>
      <div class="auth-field"><input type="password" id="login-pass" placeholder="Password" class="auth-input"><i class="fas fa-lock auth-icon"></i></div>
      <button type="button" onclick="handleLogin()" class="auth-btn"><i class="fas fa-sign-in-alt"></i> LOG IN</button>
    </div>
    
    <div id="register-form" class="hidden">
      <div class="auth-field"><input type="text" id="reg-name" placeholder="Full Name" class="auth-input"><i class="fas fa-user auth-icon"></i></div>
      <div class="auth-field"><input type="email" id="reg-email" placeholder="Email Address" class="auth-input"><i class="fas fa-envelope auth-icon"></i></div>
      <div class="auth-field"><input type="number" id="reg-phone" placeholder="Phone Number" class="auth-input"><i class="fas fa-phone auth-icon"></i></div>
      <div class="auth-field"><input type="password" id="reg-pass" placeholder="Password (6+ chars)" class="auth-input"><i class="fas fa-key auth-icon"></i></div>
      <button type="button" onclick="handleRegister()" class="auth-btn"><i class="fas fa-user-plus"></i> CREATE ACCOUNT</button>
    </div>
  </div>
</section>

<!-- MAIN APP -->
<div id="app-content" class="app-shell hidden">
  <header class="bg-white sticky top-0 z-40 shadow-sm border-b border-gray-100 p-4 flex justify-between items-center">
    <img id="header-logo-img" src="https://placehold.co/150x50/006a4e/fff?text=GAME+BAZAR" class="h-9 object-contain">
    <div class="flex items-center gap-2">
      <button onclick="showSec('addmoney')" class="flex items-center gap-1.5 bg-gradient-to-r from-[#006a4e] to-[#00875f] text-white px-3 py-2 rounded-full shadow-md">
        <i class="fas fa-wallet text-xs"></i><span class="text-[13px] font-bold">৳<span id="header-balance">0</span></span>
      </button>
      <button onclick="showSec('account')" class="w-10 h-10 rounded-full bg-[#006a4e] flex items-center justify-center text-white font-black"><span id="header-avatar">U</span></button>
    </div>
  </header>

  <main class="main-content">
    <section id="home-sec" class="sect p-3">
      <h2 class="text-xl font-black text-center text-[#003d2d] my-4">Select Game</h2>
      <div id="categories-container" class="grid grid-cols-3 gap-3"></div>
    </section>
    
    <section id="account-sec" class="hidden sect p-3">
      <div class="acc-hero">
        <h2 id="acc-name" class="text-lg font-black text-white">User</h2>
        <p id="acc-email" class="text-[11px] text-white/75">-</p>
      </div>
      <button onclick="handleLogout()" class="w-full bg-red-50 text-red-500 font-bold py-3 rounded-xl mt-4">Log Out</button>
    </section>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white border-t z-40 flex justify-around p-3">
    <button onclick="showSec('home')" class="nvi on" id="nav-home"><i class="fas fa-home ni"></i><span>Home</span></button>
    <button onclick="showSec('account')" class="nvi" id="nav-account"><i class="fas fa-user ni"></i><span>Account</span></button>
  </nav>
</div>

<!-- Firebase config initializes the compat SDK before the user panel script -->
<script type="module">
  import { db, auth } from './js/firebase-config.js';
  window.__db = db; window.__auth = auth;
</script>
<script src="js/user.js"></script>
</body>
</html>
